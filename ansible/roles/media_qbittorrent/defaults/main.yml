---
media_qbittorrent_puid: 1000
media_qbittorrent_pgid: 1000
media_qbittorrent_media_root: /mnt/hdd

# Pinned to the version that was already running, so pinning changed nothing.
media_qbittorrent_image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls476

# ⚠️ `qmcgaw/gluetun:latest` builds from master, not from a release, so it
# resolves to a commit that matches no published tag. On the container standing
# between the download client and the internet, that means nothing to roll back
# to. Pinned to a named release instead.
#
# After any bump here, the check is not that the container starts: it is that
# qBittorrent's public address is still the VPN's and the forwarded port opens.
media_qbittorrent_gluetun_image: qmcgaw/gluetun:v3.41.3

# VPN settings are read from OpenBao at run time: nothing sensitive is stored
# in the repo. Requires openbao_addr + openbao_token (see group_vars/all/).
media_qbittorrent_vault_path: qbittorrent
media_qbittorrent_vault: >-
  {{ lookup('community.hashi_vault.vault_kv2_get',
            media_qbittorrent_vault_path,
            engine_mount_point='homelab',
            url=openbao_addr,
            token=openbao_token,
            ca_cert=openbao_ca_cert).secret }}

media_qbittorrent_vpn_service_provider: "{{ media_qbittorrent_vault.vpn_service_provider }}"
media_qbittorrent_vpn_type: "{{ media_qbittorrent_vault.vpn_type }}"
media_qbittorrent_wireguard_private_key: "{{ media_qbittorrent_vault.wireguard_private_key }}"
media_qbittorrent_wireguard_addresses: "{{ media_qbittorrent_vault.wireguard_addresses }}"
media_qbittorrent_server_countries: "{{ media_qbittorrent_vault.server_countries }}"

# --- cross-seed ----------------------------------------------------------------
# Finds the torrents qBittorrent already holds on other trackers and injects
# them, hardlinked, so the same data seeds twice without downloading it again.
#
# It shares gluetun's network namespace like qBittorrent does, for two reasons:
# it reaches the WebUI on the loopback, where qBittorrent asks for no credential
# (see qbt-set-port.sh), and qBittorrent's on-completion hook reaches it on the
# loopback too. From the bridge, gluetun's firewall would block the hook, and
# opening it means FIREWALL_OUTBOUND_SUBNETS on the container guarding the VPN.
# Its tracker searches leave through the tunnel as a side effect.
media_qbittorrent_cross_seed_image: ghcr.io/cross-seed/cross-seed:6.13.7

# Hardlinks cannot cross filesystems, so the link directory has to live on the
# same disk as the data it links to. /mnt/hdd is one ext4 volume.
media_qbittorrent_cross_seed_link_dir: "{{ media_qbittorrent_media_root }}/downloads/cross-seed"

# cross-seed's own API key, 24+ characters (`openssl rand -hex 24`), in
# homelab/cross-seed. Pinned in the vault rather than left to cross-seed's
# autogenerated one, because the on-completion hook set in qBittorrent has to
# carry it.
media_qbittorrent_cross_seed_vault_path: cross-seed
media_qbittorrent_cross_seed_vault: >-
  {{ lookup('community.hashi_vault.vault_kv2_get',
            media_qbittorrent_cross_seed_vault_path,
            engine_mount_point='homelab',
            url=openbao_addr,
            token=openbao_token,
            ca_cert=openbao_ca_cert).secret }}

media_qbittorrent_cross_seed_api_key: "{{ media_qbittorrent_cross_seed_vault.api_key }}"

# Through Prowlarr, not the tracker's own Torznab endpoint: cross-seed is built
# around Prowlarr or Jackett feeds and does not support native ones. Pointed at
# V3X directly, it parses `<guid isPermaLink="true">` into an object and every
# result dies in SQLite. Upstream's answer (cross-seed/cross-seed#1223) is to
# go through Prowlarr, which is why gluetun lets this one host out of the
# tunnel.
#
# Prowlarr's key is read at play time from the host that generated it, like the
# dashboard does: no copy in the vault to drift from the real one.
media_qbittorrent_cross_seed_prowlarr_host: arr
media_qbittorrent_cross_seed_prowlarr_config: /opt/arr-stack/prowlarr/config/config.xml
media_qbittorrent_cross_seed_prowlarr_url: >-
  http://{{ hostvars[media_qbittorrent_cross_seed_prowlarr_host].ansible_host }}:9696
# Prowlarr's indexer ids, as in the URL of each indexer's Torznab feed.
media_qbittorrent_cross_seed_prowlarr_indexers:
  - 35  # V3X

# What qBittorrent runs when a download finishes: a search for that torrent
# right away, instead of waiting for the next daily pass.
media_qbittorrent_cross_seed_hook: >-
  curl -fsS -XPOST http://127.0.0.1:2468/api/webhook
  -H "X-Api-Key: {{ media_qbittorrent_cross_seed_api_key }}"
  --data-urlencode "infoHash=%I"
