---
- name: Set the system timezone
  community.general.timezone:
    name: "{{ homelab_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - htop
      - vim
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable unattended security upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Ensure the unattended-upgrades service is running
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
