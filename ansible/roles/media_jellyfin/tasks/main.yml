---
- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Jellyfin GPG key
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.gpg.key
    checksum: "sha256:{{ media_jellyfin_gpg_key_sha256 }}"
    mode: "0644"

- name: Add the Jellyfin apt repository
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: deb
    uris: https://repo.jellyfin.org/debian
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/jellyfin.gpg.key
    state: present

- name: Hold Jellyfin to its release line
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/jellyfin
    content: |
      # Managed by Ansible (media_jellyfin). A new major is a deliberate step.
      Package: jellyfin jellyfin-server jellyfin-web
      Pin: version {{ media_jellyfin_series }}.*
      Pin-Priority: 1001
    owner: root
    group: root
    mode: "0644"

- name: Install Jellyfin
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: true

- name: Grant Jellyfin access to the render device (iGPU transcoding)
  ansible.builtin.user:
    name: jellyfin
    groups: render,video
    append: true
  notify: Restart jellyfin

# The template reads the theme on the controller, so it is downloaded there.
# check_mode: false because check mode would skip the download and leave the
# template nothing to read; it only fills a local cache.
- name: Create the Cinema theme cache on the controller
  ansible.builtin.file:
    path: "{{ media_jellyfin_cinema_cache }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Download the Cinema theme release
  ansible.builtin.get_url:
    url: "https://github.com/gauthier-se/jellyfin-theme-cinema/releases/download/v{{ media_jellyfin_cinema_version }}/{{ item.name }}"
    dest: "{{ media_jellyfin_cinema_cache }}/{{ item.name }}"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ media_jellyfin_cinema_files }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Brand the web client (Custom CSS, login disclaimer, splash screen)
  ansible.builtin.template:
    src: branding.xml.j2
    dest: /etc/jellyfin/branding.xml
    owner: jellyfin
    group: jellyfin
    mode: "0644"
  notify: Restart jellyfin

- name: Find plugins that must stay off the server
  ansible.builtin.find:
    paths: /var/lib/jellyfin/plugins
    patterns: "{{ media_jellyfin_absent_plugins | map(attribute='name') | map('regex_replace', '$', '_*') | list }}"
    file_type: directory
  register: media_jellyfin_absent_plugin_dirs

- name: Remove them, with their saved settings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (media_jellyfin_absent_plugin_dirs.files | map(attribute='path') | list)
       + (media_jellyfin_absent_plugins | map(attribute='config')
          | map('regex_replace', '^', '/var/lib/jellyfin/plugins/configurations/') | list) }}
  notify: Restart jellyfin

- name: Ensure Jellyfin is enabled and running
  ansible.builtin.systemd_service:
    name: jellyfin
    enabled: true
    state: started
