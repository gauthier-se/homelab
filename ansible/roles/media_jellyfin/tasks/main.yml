---
- name: Create the keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the Jellyfin GPG key
  ansible.builtin.get_url:
    url: https://repo.jellyfin.org/jellyfin_team.gpg.key
    dest: /etc/apt/keyrings/jellyfin.gpg.key
    mode: "0644"

- name: Add the Jellyfin apt repository
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: deb
    uris: https://repo.jellyfin.org/debian
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/jellyfin.gpg.key
    state: present

- name: Install Jellyfin
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: true

- name: Grant Jellyfin access to the render device (iGPU transcoding)
  ansible.builtin.user:
    name: jellyfin
    groups: render,video
    append: true
  notify: Restart jellyfin

- name: Ensure Jellyfin is enabled and running
  ansible.builtin.systemd_service:
    name: jellyfin
    enabled: true
    state: started
