---
# The release line apt is allowed to follow. Jellyfin's repository serves every
# line under one suite, so without a pin the next `apt full-upgrade` takes the
# server across a major and runs its database migrations, which have no way
# back. Patches inside the line still arrive with the monthly pass.
#
# Moving this is a migration, not an update: vzdump the guest first, read the
# release notes, then change the value and replay the role. The role installs
# with state: present, so the replay only moves the pin: the package itself
# crosses over with `apt full-upgrade` on the guest.
#
# From 12.0 on, Jellyfin dropped the leading "10.": the first number is the
# major and 12.x are fixes, so "12" pins the line the way "10.11" did.
media_jellyfin_series: "12"

# The signing key apt trusts for this repository, pinned by digest. A key that
# changes upstream now fails the play instead of being trusted in silence, and
# with a digest to compare against get_url answers from the file on disk: no
# request, and no false "changed" in check mode. Update after checking the
# vendor's announcement, never just to make the play pass.
media_jellyfin_gpg_key_sha256: "a0cde241ae297fa6f0265c0bf15ce9eb9ee97c008904a59ab367a67d59532839"

# Branding (Dashboard > General): the role owns /etc/jellyfin/branding.xml.
# A Custom CSS or login disclaimer typed in the dashboard lasts until the next
# replay, which puts these values back and reports "changed". Jellyfin reads
# the file at start only, so a change here restarts the server.
#
# Custom CSS is the Cinema theme (github.com/gauthier-se/jellyfin-theme-cinema):
# the play downloads these files from the release on the controller and
# writes them, in order, into branding.xml, so browsers fetch nothing from a
# CDN. Each file is pinned by digest, so a release asset that changes fails
# the play. To move to a new release, change the version, then the digests
# (`shasum -a 256` on the downloaded files). An empty list serves no CSS.
media_jellyfin_cinema_version: "0.1.0"
media_jellyfin_cinema_files:
  - name: cinema.css
    sha256: "310efb2d3d9749046b05fe2cf41f46767e549d551d96471a89fe5f253c7e907d"
  # Add-ons, for the plugins this server runs
  - name: media-bar.css
    sha256: "55fbf262989e63ba943fa6b157bf08dc1e2a9db7dc8e117a4b29f953f06e3cdd"
  - name: jellyfin-enhanced.css
    sha256: "d8460dfdc672b3348697202b034a7a65853a3fe3bfcb1e59adb053a6cb3b05eb"
  - name: cinematheque.css
    sha256: "a5c9d40e842345de3d33c70f443ec6719dd38d0525fba6e3627bb8d05a488a4e"
# Where the controller keeps the downloads, one folder per release
media_jellyfin_cinema_cache: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/homelab/jellyfin-cinema/{{ media_jellyfin_cinema_version }}"
media_jellyfin_login_disclaimer: ""
media_jellyfin_splashscreen_enabled: false

# Plugins kept off the server. Jellyfin loads every folder under plugins/, so
# removing one means deleting its folder and its saved settings (a reinstall
# would pick those up again), then restarting. A plugin reinstalled from the
# dashboard is removed again on the next replay.
#
# JavaScript Injector ran its scripts in every session. The three it held were
# dead: a raw <script> tag pasted as JavaScript kept the whole bundle from
# parsing, so none of them had run.
media_jellyfin_absent_plugins:
  - name: JavaScript Injector
    config: Jellyfin.Plugin.JavaScriptInjector.xml
