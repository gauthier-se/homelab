---
- name: Create the *arr project directory
  ansible.builtin.file:
    path: /opt/arr-stack
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the *arr compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: /opt/arr-stack/compose.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart arr stack

# remove_orphans: a service taken out of the compose file is taken off the host
# too. Without it, a retired container keeps running on the old definition,
# unmanaged and unpatched, and nothing in the play says so.
- name: Start the *arr stack
  community.docker.docker_compose_v2:
    project_src: /opt/arr-stack
    state: present
    remove_orphans: true

- name: Deploy the tracker replacement job
  ansible.builtin.copy:
    src: tracker-replace.py
    dest: /opt/arr-stack/tracker-replace.py
    owner: root
    group: root
    mode: "0644"
  when: media_arr_tracker_replace_enabled

- name: Deploy the tracker replacement units
  ansible.builtin.template:
    src: "tracker-replace.{{ item }}.j2"
    dest: "/etc/systemd/system/tracker-replace.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: media_arr_tracker_replace_units
  when: media_arr_tracker_replace_enabled

# Started by its timer only: the service itself is a oneshot.
- name: Enable the tracker replacement timer
  ansible.builtin.systemd_service:
    name: tracker-replace.timer
    enabled: "{{ media_arr_tracker_replace_enabled }}"
    state: "{{ 'started' if media_arr_tracker_replace_enabled else 'stopped' }}"
    daemon_reload: "{{ media_arr_tracker_replace_units is changed }}"
