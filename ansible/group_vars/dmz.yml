---
# Public-facing Traefik, deliberately narrower than the internal instance: two
# hostnames, per-name certificates, no SSO, and a backend list the firewall
# independently restricts to the same address:port pairs.
traefik_use_wildcard: false

traefik_services:
  - name: jellyfin-public
    host: "{{ public_jellyfin_host }}"
    url: "http://10.10.20.10:8096"
    harden: true
  - name: requests-public
    host: "{{ public_requests_host }}"
    url: "http://10.10.20.11:5055"
    harden: true

# Cloudflare's published edge ranges (https://www.cloudflare.com/ips-v4 and
# ips-v6, fetched 2026-07-26). Only the proxied hostname actually transits
# these, but the entry point is shared. Re-check them yearly: Cloudflare adds
# ranges, and a missing one silently reverts that traffic to looking like it
# comes from Cloudflare rather than from the visitor.
traefik_trusted_proxies:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32

# The public entry point is the one that meets scanners, so it runs detection.
traefik_crowdsec_enabled: true
