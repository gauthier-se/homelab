[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
host_key_checking = True
interpreter_python = auto_silent
; community.general's "yaml" callback was removed in that collection's 12.0.0;
; the built-in default callback does the same via result_format.
stdout_callback = default
result_format = yaml
force_valid_group_names = ignore

[ssh_connection]
pipelining = True
